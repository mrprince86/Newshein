<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><header><a class="logo" href="index.html">NewShein</a><nav><a href="products.html">Shop</a><a href="chat.html">Customer Service</a></nav></header><main class="wrap"><h1>My Orders</h1><div id="list"></div></main><script>if(requireLogin())api('/orders').then(os=>list.innerHTML=os.length?os.map(o=>`<div class="card"><div class="row"><h3>Order #${o.id}</h3><span class="pill">${esc(o.status)}</span></div><p>Amount: <b>${money(o.final)}</b> · Payment: ${esc(o.payment_status)}</p><p>Tracking: ${esc(o.tracking||'Not assigned')}</p><a class="btn light" href="payment.html?id=${o.id}">Payment / UTR</a></div>`).join(''):'<div class="card">No orders yet.</div>').catch(e=>list.innerHTML='<div class="notice">'+esc(e.message)+'</div>')</script></body></html>
