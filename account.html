<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="wrap" style="max-width:650px"><div class="card"><h1>My Account</h1><div id="a"></div><a class="btn light" href="orders.html">My Orders</a> <a class="btn light" href="chat.html">Customer Service</a></div></main><script>if(requireLogin())api('/me').then(m=>a.innerHTML=`<p>Email: <b>${esc(m.email)}</b></p><p>Wallet Balance: <span class="stat">${money(m.wallet)}</span></p><div class="notice">Registration bonus: ₹500. Wallet usage requires ₹1,000+ eligible cart subtotal.</div>`)</script></body></html>
