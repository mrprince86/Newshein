<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - NewShein</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap" style="max-width:500px"><div class="card"><h1>Admin Login</h1><form id="f"><input id="id" placeholder="Admin ID" required><input id="password" type="password" placeholder="Password" required><button class="btn pink">Login</button></form><div id="m"></div></div></main><script>f.onsubmit=e=>{e.preventDefault();fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id.value,password:password.value})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('ns_admin',d.token);location.href='admin.html'}).catch(e=>m.innerHTML='<div class="notice">'+e.message+'</div>')}</script></body></html>
