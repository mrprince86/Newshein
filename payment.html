<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="wrap" style="max-width:650px"><div class="card" id="box">Loading...</div></main><script>if(requireLogin())load();async function load(){try{const id=new URLSearchParams(location.search).get('id');const o=await api('/orders/'+id);box.innerHTML=`<h1>Payment</h1><p>Order #${o.id}</p><h2>Pay ${money(o.amount)}</h2><img class="qr" src="/api/payment/qr/${o.id}"><p>UPI ID: <b>${esc(o.upi)}</b></p><p class="muted">After payment, enter your UTR. Admin will verify and approve it.</p><form id="f"><input id="utr" placeholder="Enter UTR / transaction reference" required><button class="btn pink">Submit UTR</button></form><div id="m"></div>`;f.onsubmit=e=>{e.preventDefault();api('/orders/'+o.id+'/utr',{method:'POST',body:JSON.stringify({utr:utr.value})}).then(()=>m.innerHTML='<div class="notice success">UTR submitted. Payment verification pending.</div>').catch(e=>m.innerHTML='<div class="notice">'+esc(e.message)+'</div>')}}catch(e){box.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}</script></body></html>
