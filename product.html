<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><header><a class="logo" href="index.html">NewShein</a><nav><a href="products.html">Shop</a><a href="cart.html">Cart</a></nav></header><main class="wrap"><div id="p" class="card"></div></main><script>header();const id=new URLSearchParams(location.search).get('id');api('/products/'+id).then(p=>document.querySelector('#p').innerHTML=`<div class="grid"><img class="product-img" src="${esc(p.image||'https://placehold.co/700x800?text=NewShein')}"><div><h1>${esc(p.name)}</h1><p class="price">${money(p.price)}</p><p>${esc(p.description)}</p><p>Category: ${esc(p.category)} · Stock: ${p.stock}</p><button class="btn pink" onclick="addToCart(${p.id})">Add to Cart</button></div></div>`).catch(e=>p.innerHTML='<div class="notice">'+esc(e.message)+'</div>')</script></body></html>
