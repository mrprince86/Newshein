<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><header><a class="logo" href="index.html">NewShein</a><nav><a href="cart.html">Cart</a><a href="orders.html">Orders</a><a href="chat.html">Chat</a><a href="account.html">Account</a></nav></header><main class="wrap"><h1>Shop</h1><div id="products" class="grid"></div></main><script>header();api('/products').then(ps=>products.innerHTML=ps.map(p=>`<div class="card"><img class="product-img" src="${esc(p.image||'https://placehold.co/600x700?text=NewShein')}"><h3>${esc(p.name)}</h3><p>${esc(p.category)}</p><p class="price">${money(p.price)}</p><p class="muted">Stock: ${p.stock}</p><a class="btn light" href="product.html?id=${p.id}">Details</a> <button class="btn pink" onclick="addToCart(${p.id})">Add to Cart</button></div>`).join('')).catch(e=>products.innerHTML='<div class="card">'+esc(e.message)+'</div>')</script></body></html>
