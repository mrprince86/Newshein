<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="wrap" style="max-width:520px"><div class="card"><h1>Create Account</h1><p class="muted">Email ID se register karein. Mobile number required nahi hai.</p><form id="form"><label>Email ID</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button class="btn pink">Register</button></form><p>Already account? <a href="login.html">Login</a></p><div id="msg"></div></div></main><script>form.onsubmit=e=>{e.preventDefault();api('/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})}).then(d=>{localStorage.setItem('ns_token',d.token);location.href='index.html'}).catch(e=>msg.innerHTML='<div class="notice">'+esc(e.message)+'</div>')}</script></body></html>
