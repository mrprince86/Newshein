<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="wrap" style="max-width:700px"><div class="card"><h1>Checkout</h1><div id="summary"></div><form id="form"><label>Delivery Address</label><textarea id="address" required minlength="10" placeholder="House, street, city, state, pincode"></textarea><label><input id="wallet" type="checkbox" style="width:auto"> Use wallet (available only at ₹1,000+ subtotal)</label><button class="btn pink">Place Order & Continue to Payment</button></form><div id="msg"></div></div></main><script>if(requireLogin())preview();function preview(){api('/orders/preview').then(d=>summary.innerHTML=`<div class="notice ${d.walletEligible?'success':''}">Subtotal: <b>${money(d.subtotal)}</b><br>Wallet eligible: <b>${d.walletEligible?'Yes':'No'}</b><br>Wallet available: ${money(d.walletBalance)}<br>Final with eligible wallet: <b>${money(d.final)}</b></div>`).catch(e=>msg.innerHTML='<div class="notice">'+esc(e.message)+'</div>')}form.onsubmit=e=>{e.preventDefault();api('/orders',{method:'POST',body:JSON.stringify({address:address.value,useWallet:wallet.checked?1:0})}).then(d=>location.href='payment.html?id='+d.orderId).catch(e=>msg.innerHTML='<div class="notice">'+esc(e.message)+'</div>')}</script></body></html>
