<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="wrap" style="max-width:520px"><div class="card"><h1>Login</h1><form id="form"><label>Email ID</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn pink">Login</button></form><p>New customer? <a href="register.html">Create account</a></p><div id="msg"></div></div></main><script>form.onsubmit=e=>{e.preventDefault();api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})}).then(d=>{localStorage.setItem('ns_token',d.token);const n=new URLSearchParams(location.search).get('next');location.href=n||'index.html'}).catch(e=>msg.innerHTML='<div class="notice">'+esc(e.message)+'</div>')}</script></body></html>
