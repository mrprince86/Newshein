<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - NewShein</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">NewShein Admin</a><button class="btn light" onclick="localStorage.removeItem('ns_admin');location.href='admin-login.html'">Logout</button></header><main class="wrap"><div id="stats" class="grid"></div><div class="card"><h2>UPI Settings</h2><input id="upi"><button class="btn pink" onclick="saveUpi()">Save UPI ID</button><span id="um"></span></div><div class="card"><h2>Add Unlimited Products</h2><form id="pf" class="grid"><input id="name" placeholder="Product name" required><input id="price" type="number" step="0.01" placeholder="Price" required><input id="stock" type="number" placeholder="Stock"><input id="category" placeholder="Category"><input id="image" placeholder="Image URL"><textarea id="description" placeholder="Description"></textarea><button class="btn pink">Add Product</button></form></div><div class="card"><h2>Products</h2><div id="products"></div></div><div class="card"><h2>Orders / Payments / Tracking</h2><div id="orders"></div></div><div class="card"><h2>Customer Chat</h2><div id="chats"></div></div></main><script>const T=localStorage.getItem('ns_admin');const H={'Content-Type':'application/json',Authorization:T};function A(p,o={}){o.headers={...H,...(o.headers||{})};return fetch('/api'+p,o).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d})}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}if(!T)location.href='admin-login.html';load();async function load(){try{const s=await A('/admin/summary');stats.innerHTML=[['Users',s.users],['Products',s.products],['Orders',s.orders],['Pending Payments',s.pending]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('');upi.value=s.upi;const ps=await A('/admin/products');products.innerHTML=ps.map(p=>`<div class="card"><b>${esc(p.name)}</b> · ₹${(p.price_paise/100).toFixed(2)} · stock ${p.stock} · ${p.active?'Active':'Inactive'} <button class="btn light" onclick="toggle(${p.id},${p.active})">${p.active?'Deactivate':'Activate'}</button></div>`).join('')||'No products';const os=await A('/admin/orders');orders.innerHTML=os.map(o=>`<div class="card"><b>#${o.id}</b> ${esc(o.email)} · ₹${(o.final_paise/100).toFixed(2)} · Payment ${esc(o.payment_status)} · Status ${esc(o.status)}<br>UTR: ${esc(o.utr||'none')}<br><button class="btn pink" onclick="pay(${o.id},'approve')">Approve</button> <button class="btn danger" onclick="pay(${o.id},'reject')">Reject</button><select id="st${o.id}"><option>Processing</option><option>Shipped</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><input id="tr${o.id}" placeholder="Tracking number" value="${esc(o.tracking||'')}"><button class="btn light" onclick="track(${o.id})">Update Tracking</button></div>`).join('')||'No orders';const cs=await A('/admin/chats');chats.innerHTML=cs.map(c=>`<div class="card"><b>${esc(c.email)}</b> (${esc(c.sender)}): ${esc(c.message)}<form onsubmit="reply(event,${c.user_id})"><input id="r${c.user_id}" placeholder="Reply"><button class="btn light">Reply</button></form></div>`).join('')||'No chat messages'}catch(e){document.body.innerHTML='<main class="wrap"><div class="notice">'+esc(e.message)+'</div></main>'}}function saveUpi(){A('/admin/settings/upi',{method:'POST',body:JSON.stringify({upi:upi.value})}).then(()=>um.textContent=' Saved').catch(e=>alert(e.message))}pf.onsubmit=e=>{e.preventDefault();A('/admin/products',{method:'POST',body:JSON.stringify({name:name.value,price:Number(price.value),stock:Number(stock.value||0),category:category.value,image:image.value,description:description.value})}).then(()=>{pf.reset();load()}).catch(e=>alert(e.message))};function toggle(id,a){A('/admin/products/'+id,{method:'PATCH',body:JSON.stringify({active:!a})}).then(load)}function pay(id,action){A('/admin/orders/'+id+'/payment',{method:'POST',body:JSON.stringify({action})}).then(load).catch(e=>alert(e.message))}function track(id){A('/admin/orders/'+id+'/tracking',{method:'PATCH',body:JSON.stringify({status:document.querySelector('#st'+id).value,tracking:document.querySelector('#tr'+id).value})}).then(load).catch(e=>alert(e.message))}function reply(e,id){e.preventDefault();const x=document.querySelector('#r'+id);A('/admin/chats/'+id,{method:'POST',body:JSON.stringify({message:x.value})}).then(load).catch(e=>alert(e.message))}</script></body></html>
