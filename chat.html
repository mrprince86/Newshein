<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Service - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><main class="wrap" style="max-width:700px"><div class="card"><h1>Customer Service</h1><div id="chat" class="chat"></div><form id="f" class="row"><input id="message" placeholder="Message admin..." required><button class="btn pink">Send</button></form></div></main><script>if(requireLogin())load();async function load(){const ms=await api('/chat');chat.innerHTML=ms.map(x=>`<div class="bubble ${x.sender==='customer'?'me':''}"><b>${esc(x.sender)}</b><br>${esc(x.message)}</div>`).join('')||'<p class="muted">Start a conversation with admin.</p>';chat.scrollTop=chat.scrollHeight}f.onsubmit=e=>{e.preventDefault();api('/chat',{method:'POST',body:JSON.stringify({message:message.value})}).then(()=>{message.value='';load()}).catch(e=>alert(e.message))}</script></body></html>
