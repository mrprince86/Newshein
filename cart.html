<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart - NewShein</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><header><a class="logo" href="index.html">NewShein</a><nav><a href="products.html">Shop</a><a href="orders.html">Orders</a></nav></header><main class="wrap"><h1>Your Cart</h1><div id="cart"></div></main><script>if(requireLogin())load();async function load(){try{const d=await api('/cart');cart.innerHTML=(d.items.length?d.items.map(i=>`<div class="card row"><div><b>${esc(i.name)}</b><p>${money(i.price)} × ${i.qty}</p></div><div><button class="btn light" onclick="change(${i.id},${i.qty-1})">−</button> <button class="btn light" onclick="change(${i.id},${i.qty+1})">+</button> <button class="btn danger" onclick="del(${i.id})">Remove</button></div></div>`).join(''):'<div class="card">Cart is empty. <a href="products.html">Shop now</a></div>')+(d.items.length?`<div class="card"><h2>Subtotal: ${money(d.subtotal)}</h2><p>Wallet balance: ${money(d.wallet)}</p><p>₹500 bonus can be used only when eligible cart subtotal is ₹1,000 or more.</p><a class="btn pink" href="checkout.html">Checkout</a></div>`:'')}</div>}catch(e){cart.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}function change(id,qty){api('/cart/'+id,{method:'PATCH',body:JSON.stringify({qty})}).then(load).catch(e=>alert(e.message))}function del(id){api('/cart/'+id,{method:'DELETE'}).then(load)}</script></body></html>
